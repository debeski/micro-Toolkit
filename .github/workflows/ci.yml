name: CI

# Green-checkmark gate on every push/PR to main or beta: verify DNgine packages
# on Windows (PyInstaller onedir + Inno Setup installer), Linux (.deb + python
# dists), and macOS (.app bundle). Each build first signs the first-party
# plugins and regenerates the builtin plugin manifest, matching the build_*
# scripts. Releases run separately via release.yml on version tags.

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Sign first-party plugins + manifest
        run: |
          python tools/build_fp_plugins.py
          python tools/gen_builtin_manifest.py
      - name: Build (PyInstaller onedir)
        run: python -m PyInstaller --noconfirm --clean dngine.spec
      - name: Verify build
        shell: pwsh
        run: if (!(Test-Path dist/dngine/dngine.exe)) { throw "dist/dngine/dngine.exe not produced" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" dngine.iss
          $ver = (Get-Content dngine/VERSION -Raw).Trim()
          if (!(Test-Path "DNgine-Setup-$ver.exe")) { throw "installer was not produced" }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libs + packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 dpkg-dev
      - name: Build (onedir + .deb + python dists)
        run: bash build_linux.sh
      - name: Verify .deb produced
        run: ls -1 dist/*.deb

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (.app bundle)
        run: bash build_macos.sh
      - name: Verify build
        run: test -d "dist/DNgine.app" || { echo "dist/DNgine.app not produced"; exit 1; }
