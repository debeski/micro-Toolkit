name: Release

# Triggered by pushing a version tag, e.g.:
#   git tag -a v0.10.0 -m "v0.10.0" && git push origin v0.10.0
#
# Pipeline:
#   verify         -> tag == dngine/VERSION
#   windows        -> PyInstaller onedir + Inno Setup installer (DNgine-Setup-<ver>.exe)
#   linux          -> onedir + .deb + wheel/sdist (build_linux.sh)
#   macos          -> PyInstaller .app, zipped (DNgine-<ver>-macos.zip)
#   github-release -> attach all artifacts, notes from the CHANGELOG section
#
# No registry credentials needed: artifacts go to a GitHub Release via GITHUB_TOKEN.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag matches dngine/VERSION
        run: |
          file="$(tr -d '[:space:]' < dngine/VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag VERSION=$file"
          if [ "$file" != "$tag" ]; then
            echo "::error::Tag ($tag) != dngine/VERSION ($file). Bump dngine/VERSION before tagging."
            exit 1
          fi

  windows:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Sign first-party plugins + manifest
        run: |
          python tools/build_fp_plugins.py
          python tools/gen_builtin_manifest.py
      - name: Build (PyInstaller onedir)
        run: python -m PyInstaller --noconfirm --clean dngine.spec
      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" dngine.iss
          $ver = (Get-Content dngine/VERSION -Raw).Trim()
          if (!(Test-Path "DNgine-Setup-$ver.exe")) { throw "installer was not produced" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: DNgine-Setup-*.exe
          if-no-files-found: error

  linux:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Qt runtime libs + packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 dpkg-dev
      - name: Build (onedir + .deb + python dists)
        run: bash build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build (.app bundle)
        run: bash build_macos.sh
      - name: Package .app as zip
        run: |
          ver="$(tr -d '[:space:]' < dngine/VERSION)"
          ditto -c -k --keepParent "dist/DNgine.app" "DNgine-${ver}-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: DNgine-*-macos.zip
          if-no-files-found: error

  github-release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Extract this version's CHANGELOG section
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v ver="$ver" '
            $0 ~ ("^## " ver "([ \\-]|$)") { grab=1; next }
            grab && /^## / { exit }
            grab { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then echo "Release ${GITHUB_REF_NAME}." > RELEASE_NOTES.md; fi
          echo "---- notes ----"; cat RELEASE_NOTES.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: release-files/*
          fail_on_unmatched_files: true
